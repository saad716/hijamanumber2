<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hijama Agent 2</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<!-- ── STRIPE.JS ── -->
<script src="https://js.stripe.com/v3/"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    height: 100dvh;
    font-family: 'DM Sans', sans-serif;
    background: #eef4ee;
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  .shell {
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
  }

  @media (min-width: 600px) {
    body {
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(26,74,48,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(45,110,71,0.1) 0%, transparent 55%),
        #eef4ee;
    }
    .shell {
      max-width: 460px;
      height: 92vh;
      max-height: 800px;
      min-height: 500px;
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(26,74,48,0.18), 0 2px 12px rgba(0,0,0,0.08);
    }
  }

  /* HEADER */
  .hdr {
    background: linear-gradient(135deg, #0000FF 0%, #1a4a30 45%, #2d6e47 100%);
    padding: 14px 16px 13px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 11px;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .hdr::before {
    content: ''; position: absolute; top: -35px; right: -35px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .av {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative; z-index: 1;
  }
  .av svg { width: 22px; height: 22px; }
  .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #5cdb95; border: 2px solid #1a4a30;
  }
  .hdr-info { flex: 1; position: relative; z-index: 1; min-width: 0; }
  .hdr-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 600; color: #fff;
    letter-spacing: 0.02em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-sub {
    font-size: 10.5px; color: rgba(255,255,255,0.55);
    margin-top: 2px; font-weight: 300; letter-spacing: 0.03em;
  }
  .live-pill {
    background: rgba(92,219,149,0.15);
    border: 1px solid rgba(92,219,149,0.3);
    color: #5cdb95; font-size: 10px; padding: 3px 9px;
    border-radius: 20px; letter-spacing: 0.06em; font-weight: 500;
    position: relative; z-index: 1; white-space: nowrap; flex-shrink: 0;
  }

  /* TRUST BAR */
  .trust {
    background: #f7fbf7; border-bottom: 1px solid #e2ede6;
    padding: 6px 14px; display: flex; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .trust::-webkit-scrollbar { display: none; }
  .trust-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: #2d6e47; font-weight: 500;
    white-space: nowrap; padding-right: 14px; flex-shrink: 0;
  }
  .trust-item span { color: #777; font-weight: 400; }

  /* BISMILLAH */
  .bism {
    text-align: center; padding: 7px 0 2px;
    font-size: 12px; color: #2d6e47;
    letter-spacing: 0.08em; opacity: 0.45;
    font-weight: 300; flex-shrink: 0;
  }

  /* MESSAGES */
  .msgs {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px 8px;
    display: flex; flex-direction: column; gap: 11px;
    overscroll-behavior: contain;
  }
  .msgs::-webkit-scrollbar { width: 3px; }
  .msgs::-webkit-scrollbar-thumb { background: rgba(26,74,48,0.12); border-radius: 2px; }

  /* ── OPTION BUTTONS (replaces chips) ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 4px 0 8px;
    max-width: 86%;
  }
  .opt-btn {
    background: #f0f9f3;
    border: 1.5px solid #c0ddc9;
    color: #1a4a30;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
    white-space: normal;
    text-align: left;
    line-height: 1.45;
    font-family: 'DM Sans', sans-serif;
    display: block;
    width: 100%;
  }
  .opt-btn:hover  { background: #2d6e47; color: #fff; border-color: #2d6e47; }
  .opt-btn:active { transform: scale(0.97); }
  .opt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg { display: flex; gap: 7px; animation: up 0.28s ease; }
  .msg.u { flex-direction: row-reverse; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .mav {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 500; align-self: flex-end;
  }
  .mav.b { background: linear-gradient(135deg, #0000FF, #2d6e47); color: #fff; font-family: 'Playfair Display', serif; font-size: 12px; }
  .mav.u { background: #e6f4ec; color: #2d6e47; font-size: 11px; }

  .bub {
    max-width: 80%; padding: 10px 13px; border-radius: 18px;
    font-size: 14px; line-height: 1.65; font-weight: 400; word-break: break-word;
  }
  .bub.b {
    background: #f4f9f5; border: 1px solid #d6eadc;
    color: #1c3828; border-bottom-left-radius: 4px;
  }
  .bub.u {
    background: linear-gradient(135deg, #1a4a30, #2d6e47);
    color: #fff; border-bottom-right-radius: 4px;
  }

  /* MARKDOWN STYLES */
  .bub.b strong { color: #0000FF; font-weight: 600; }
  .bub.b em { font-style: italic; color: #2d6e47; }
  .bub.b ul, .bub.b ol { margin: 6px 0 4px 0; padding-left: 18px; }
  .bub.b li { margin-bottom: 4px; line-height: 1.55; }
  .bub.b ul li { list-style-type: disc; }
  .bub.b ol li { list-style-type: decimal; }
  .bub.b p { margin-bottom: 6px; }
  .bub.b p:last-child { margin-bottom: 0; }
  .bub.b h1, .bub.b h2, .bub.b h3 { font-family: 'Playfair Display', serif; color: #0000FF; margin: 8px 0 4px; line-height: 1.3; }
  .bub.b h1 { font-size: 16px; }
  .bub.b h2 { font-size: 15px; }
  .bub.b h3 { font-size: 14px; font-weight: 600; }
  .bub.b a { color: #1a7a46; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .bub.b a:hover { color: #0000FF; }
  .bub.b code { background: #e4f1e9; color: #0000FF; border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: monospace; }
  .bub.b blockquote { border-left: 3px solid #2d6e47; padding-left: 10px; margin: 6px 0; color: #4a7a5e; font-style: italic; }
  .bub.b hr { border: none; border-top: 1px solid #d6eadc; margin: 8px 0; }

  /* TYPING */
  .tdots { display: flex; gap: 4px; align-items: center; padding: 11px 14px; background: #f4f9f5; border: 1px solid #d6eadc; border-radius: 18px; border-bottom-left-radius: 4px; }
  .d { width: 5px; height: 5px; background: #2d6e47; border-radius: 50%; opacity: 0.5; animation: bop 1.2s infinite; }
  .d:nth-child(2) { animation-delay: .2s; }
  .d:nth-child(3) { animation-delay: .4s; }
  @keyframes bop { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* ERROR */
  .bub.err { background: #fff5f5; border: 1px solid #f5c6c6; color: #7a2020; border-bottom-left-radius: 4px; }
  .retry-btn { display: inline-block; margin-top: 6px; background: #fff; border: 1px solid #e0b0b0; color: #7a2020; font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .retry-btn:hover { background: #7a2020; color: #fff; }

  /* ═══════════════════════════════════════
     CHECKOUT CARD
  ═══════════════════════════════════════ */
  .checkout-wrap {
    max-width: 92%;
    animation: up 0.32s ease;
  }

  .checkout-card {
    background: #fff;
    border: 1.5px solid #c8e0d0;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(26,74,48,0.10);
  }

  .ck-hdr {
    background: linear-gradient(135deg, #0000FF 0%, #2d6e47 100%);
    padding: 14px 16px 12px;
    position: relative; overflow: hidden;
  }
  .ck-hdr::after {
    content: ''; position: absolute;
    top: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .ck-hdr-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 600;
    color: #fff; margin-bottom: 2px;
  }
  .ck-hdr-sub {
    font-size: 10.5px; color: rgba(255,255,255,0.6);
    font-weight: 300;
  }

  .ck-plans {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 14px 14px 10px;
  }
  .ck-plan {
    border: 1.5px solid #d0e8d8;
    border-radius: 12px; padding: 10px 10px 8px;
    cursor: pointer; transition: all 0.18s;
    text-align: center; position: relative;
    background: #f9fdf9;
    -webkit-tap-highlight-color: transparent;
  }
  .ck-plan:hover { border-color: #2d6e47; background: #f0f9f3; }
  .ck-plan.selected {
    border-color: #1a4a30;
    background: linear-gradient(135deg, #f0f9f3, #e6f4ec);
    box-shadow: 0 2px 10px rgba(26,74,48,0.12);
  }
  .ck-plan.selected::after {
    content: '✓';
    position: absolute; top: 6px; right: 8px;
    font-size: 11px; color: #1a4a30; font-weight: 700;
  }
  .ck-plan-name {
    font-size: 11px; font-weight: 500;
    color: #4a7a5e; margin-bottom: 4px;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .ck-plan-price {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 600;
    color: #0000FF; line-height: 1;
  }
  .ck-plan-note {
    font-size: 10px; color: #7aaa8a;
    margin-top: 4px; line-height: 1.3;
  }
  .ck-plan-badge {
    display: inline-block;
    background: #e8f5ec; color: #1a6635;
    font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    margin-top: 4px; letter-spacing: 0.04em;
  }

  .ck-fields { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }

  .ck-input {
    width: 100%; padding: 10px 13px;
    border: 1.5px solid #d0e8d8; border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: #1c3828;
    background: #f9fdf9; outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .ck-input:focus {
    border-color: #2d6e47;
    box-shadow: 0 0 0 3px rgba(45,110,71,0.08);
    background: #fff;
  }
  .ck-input::placeholder { color: #a8c8b4; }

  .stripe-box {
    border: 1.5px solid #d0e8d8;
    border-radius: 10px; padding: 11px 13px;
    background: #f9fdf9;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .stripe-box.focused {
    border-color: #2d6e47;
    box-shadow: 0 0 0 3px rgba(45,110,71,0.08);
    background: #fff;
  }

  .ck-error {
    font-size: 12px; color: #b94040;
    min-height: 16px; padding: 0 2px;
  }

  .ck-pay-btn {
    width: 100%;
    background: linear-gradient(135deg, #0000FF, #2d6e47);
    color: #fff; border: none; border-radius: 12px;
    padding: 13px; font-size: 14px; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; letter-spacing: 0.02em;
    transition: opacity 0.18s, transform 0.12s;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    -webkit-tap-highlight-color: transparent;
  }
  .ck-pay-btn:hover { opacity: 0.92; }
  .ck-pay-btn:active { transform: scale(0.98); }
  .ck-pay-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .ck-pay-btn .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .ck-pay-btn.loading .spinner { display: block; }
  .ck-pay-btn.loading .btn-label { opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ck-footer {
    text-align: center; padding: 10px 14px 14px;
    font-size: 10px; color: #9ab8a4;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .ck-footer svg { width: 11px; height: 11px; opacity: 0.6; }

  .ck-divider {
    height: 1px; background: #e8f0eb;
    margin: 10px 14px;
  }

  .success-bub {
    background: linear-gradient(135deg, #e6f4ec, #f0faf3);
    border: 1.5px solid #a8d8b8;
    border-radius: 18px; border-bottom-left-radius: 4px;
    padding: 14px 16px;
    max-width: 85%;
  }
  .success-icon {
    font-size: 28px; margin-bottom: 8px; display: block;
  }
  .success-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 600;
    color: #0000FF; margin-bottom: 5px;
  }
  .success-msg {
    font-size: 13px; color: #2d5a3d; line-height: 1.6;
  }
  .success-ref {
    margin-top: 8px; font-size: 11px;
    color: #7aaa8a; font-weight: 500;
  }

  /* INPUT */
  .inp-area {
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid #e2ede6;
    background: #f7fbf7; flex-shrink: 0;
  }
  .inp-row {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1.5px solid #cde0d4;
    border-radius: 50px; padding: 8px 8px 8px 16px;
    transition: border-color 0.2s;
  }
  .inp-row:focus-within { border-color: #2d6e47; box-shadow: 0 0 0 3px rgba(45,110,71,0.07); }
  .inp-row input {
    flex: 1; background: none; border: none; outline: none;
    color: #1c3828; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 400; caret-color: #2d6e47; min-width: 0;
  }
  .inp-row input::placeholder { color: #abc8b5; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #1a4a30, #2d6e47);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.12s; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .send-btn:not(:disabled):active { opacity: 0.8; transform: scale(0.94); }
  .send-btn svg { width: 16px; height: 16px; }
  .inp-footer { text-align: center; margin-top: 5px; font-size: 10px; color: #bbb; letter-spacing: 0.02em; }
</style>
</head>

<div class="shell">

  <!-- HEADER -->
  <div class="hdr">
    <div class="av">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M14 5C10 5 7 8 7 11.5c0 2 1 3.8 2.5 5C6.5 18 4.5 21 4.5 24.5h19C23.5 21 21.5 18 18.5 16.5 20 14.8 21 13 21 11.5 21 8 18 5 14 5z" fill="rgba(255,255,255,0.2)"/>
        <circle cx="14" cy="11" r="3" fill="rgba(255,255,255,0.5)"/>
        <path d="M10 22c.8-2.5 2-4 4-4s3.2 1.5 4 4" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round"/>

      <div class="online-dot"></div>
    </div>
    <div class="hdr-info">
      <!-- ✏️ CHANGE 1: Updated header name and subtitle -->
      <div class="hdr-name">Agent No 2  </div>
      <div class="hdr-sub">As-salamu alaykum Sister 🤍</div>
    </div>

  </div>

  <!-- TRUST BAR -->
  <div class="trust">
    <div class="trust-item">🎓 <span>Level 5 Accredited</span></div>

<script>
  /* ══════════════════════════════════════════
     CONFIGURATION — CHANGE THESE
  ══════════════════════════════════════════ */
  const WEBHOOK_URL        = 'https://ai.botyama.com/webhook/BOT TEST';
  const STRIPE_PUBLIC_KEY  = 'pk_live_51QCh96Rr6Jjm2unfhnqIpL3qZHlpsyf19SEGxs278rZ8F3AVl79spkdoZm48r5F0UMtP9k9k4qwoUToD6Ud6TMDW0053wpSxGP';

  /* ══════════════════════════════════════════
     SESSION
  ══════════════════════════════════════════ */
  const SESSION_ID = 'hn_' + Math.random().toString(36).slice(2, 11) + '_' + Date.now();

  let isBusy = false;
  let lastUserMessage = '';

  /* ══════════════════════════════════════════
     STRIPE STATE
  ══════════════════════════════════════════ */
  let stripeInstance = null;
  let cardElement    = null;
  let selectedAmount = 497;
  let selectedPlan   = 'Full Payment';

  /* ══════════════════════════════════════════
     ✏️ CHANGE 3: 5 OPTION BUTTONS (from the prompt)
  ══════════════════════════════════════════ */
  const STARTER_OPTIONS = [
    "I feel like I'm meant for more… but I don't know where to start",
    "I want to earn halal income from home without compromising my family",
    "I want to revive a Sunnah and do something meaningful with my life",
    "I feel drawn to natural healing and want to help others",
    "How much is it and are there payment options?"
  ];

  /* ══════════════════════════════════════════
     MARKDOWN PARSER
  ══════════════════════════════════════════ */
  function parseMarkdown(raw) {
    let html = raw;
    html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
    html = html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
    html = html.replace(/^---+$/gm,'<hr>');
    html = html.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g,'<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g,'<em>$1</em>');
    html = html.replace(/_(.+?)_/g,'<em>$1</em>');
    html = html.replace(/`(.+?)`/g,'<code>$1</code>');
    html = html.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/(?<!["\(>])(https?:\/\/[^\s<"'\)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g,(b)=>'<ul>'+b+'</ul>');
    html = html.replace(/^\d+\. (.+)$/gm,'<oli>$1</oli>');
    html = html.replace(/(<oli>.*<\/oli>\n?)+/g,(b)=>'<ol>'+b.replace(/<\/?oli>/g,t=>t==='<oli>'?'<li>':'</li>')+'</ol>');
    html = html.replace(/\n{2,}/g,'\n\n');
    html = html.split('\n\n').map(line=>{
      const t=line.trim();
      if(!t) return '';
      if(/^<(h[1-3]|ul|ol|blockquote|hr|li)/.test(t)) return t;
      return '<p>'+t.replace(/\n/g,'<br>')+'</p>';
    }).filter(Boolean).join('\n');
    return html;
  }

  /* ══════════════════════════════════════════
     UTILITIES
  ══════════════════════════════════════════ */
  function scrollB() {
    const el = document.getElementById('msgs');
    setTimeout(()=>{ el.scrollTop = el.scrollHeight; }, 40);
  }
  function escapeHtml(s)  { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function setBusy(state) {
    isBusy = state;
    document.getElementById('send-btn').disabled = state;
    document.getElementById('inp').disabled = state;
    // Also disable any option buttons still visible
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = state);
  }

  /* ══════════════════════════════════════════
     ✏️ CHANGE 4: RENDER OPENING GREETING + OPTIONS ON LOAD
  ══════════════════════════════════════════ */
  function renderOpening() {
    const m = document.getElementById('msgs');

    // Bot greeting message
    const greetDiv = document.createElement('div');
    greetDiv.className = 'msg';
    greetDiv.innerHTML = `
      <div class="mav b">H</div>
      <div class="bub b">
        <p>As-salamu alaykum Sister 🤍</p>
        <p>Tell me… what made you stop and look at this today?</p>
      </div>
    `;
    m.appendChild(greetDiv);

    // Option buttons block (attached under the greeting, no bot avatar)
    const optsDiv = document.createElement('div');
    optsDiv.id = 'starter-options';
    optsDiv.style.cssText = 'padding-left: 35px; display: flex; flex-direction: column; gap: 7px; padding-bottom: 4px;';

    STARTER_OPTIONS.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = label;
      btn.onclick = () => handleOptionClick(label);
      optsDiv.appendChild(btn);
    });

    m.appendChild(optsDiv);
    scrollB();
  }

  function removeOptions() {
    document.getElementById('starter-options')?.remove();
  }

  function handleOptionClick(text) {
    removeOptions();
    sendMessage(text);
  }

  /* ══════════════════════════════════════════
     MESSAGE RENDERERS
  ══════════════════════════════════════════ */
  function appendUser(txt) {
    removeOptions();
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg u';
    d.innerHTML = `<div class="mav u">👤</div><div class="bub u">${escapeHtml(txt)}</div>`;
    m.appendChild(d);
  }

  function appendTyping() {
    const m = document.getElementById('msgs');
    const id = 'ty' + Date.now();
    const d = document.createElement('div');
    d.id = id; d.className = 'msg';
    d.innerHTML = `<div class="mav b">H</div><div class="tdots"><div class="d"></div><div class="d"></div><div class="d"></div></div>`;
    m.appendChild(d);
    return id;
  }

  function appendBot(rawContent) {
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<div class="mav b">H</div><div class="bub b">${parseMarkdown(rawContent)}</div>`;
    m.appendChild(d);
    scrollB();
  }

  function appendError() {
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<div class="mav b">H</div><div class="bub err">
      Sorry, there was a connection issue. Please try again.
      <br><button class="retry-btn" onclick="retry()">↺ Retry</button>
    </div>`;
    m.appendChild(d);
    scrollB();
  }

  function retry() {
    if (!lastUserMessage || isBusy) return;
    document.querySelectorAll('.bub.err').forEach(e=>e.closest('.msg')?.remove());
    sendMessage(lastUserMessage);
  }

  /* ══════════════════════════════════════════
     CHECKOUT — RENDER CARD
  ══════════════════════════════════════════ */
  function appendCheckout() {
    document.getElementById('checkout-card')?.remove();

    const m = document.getElementById('msgs');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg';
    wrapper.id = 'checkout-card';
    wrapper.innerHTML = `
      <div class="mav b">H</div>
      <div class="checkout-wrap">
        <div class="checkout-card">

          <div class="ck-hdr">
            <div class="ck-hdr-title">🎓 Enrol in the Level 5 Diploma</div>
            <div class="ck-hdr-sub">Secure checkout · Powered by Stripe</div>
          </div>

          <div class="ck-plans">
            <div class="ck-plan selected" id="plan-full" onclick="selectPlan('full')">
              <div class="ck-plan-name">Full Payment</div>
              <div class="ck-plan-price">£497</div>
              <div class="ck-plan-note">Save £1,491 today</div>
              <div class="ck-plan-badge">BEST VALUE</div>
            </div>
            <div class="ck-plan" id="plan-deposit" onclick="selectPlan('deposit')">
              <div class="ck-plan-name">Deposit</div>
              <div class="ck-plan-price">£100</div>
              <div class="ck-plan-note">Lock in your place now</div>
              <div class="ck-plan-badge">PAY LATER</div>
            </div>
          </div>

          <div class="ck-divider"></div>

          <div class="ck-fields">
            <input class="ck-input" type="text"  id="ck-name"  placeholder="Full Name" autocomplete="name"/>
            <input class="ck-input" type="email" id="ck-email" placeholder="Email Address" autocomplete="email"/>
            <div id="stripe-card-element" class="stripe-box"></div>
            <div id="ck-error" class="ck-error"></div>
          </div>

          <div class="ck-divider"></div>

          <div style="padding: 0 14px;">
            <button class="ck-pay-btn" id="ck-pay-btn" onclick="handlePayment()">
              <div class="spinner"></div>
              <span class="btn-label">Pay £497 Securely 🔒</span>
            </button>
          </div>

          <div class="ck-footer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            256-bit SSL · 90-Day Money Back Guarantee
          </div>

        </div>
      </div>
    `;
    m.appendChild(wrapper);
    scrollB();
    initStripe();
  }

  /* ══════════════════════════════════════════
     STRIPE INIT
  ══════════════════════════════════════════ */
  function initStripe() {
    stripeInstance = Stripe(STRIPE_PUBLIC_KEY);
    const elements = stripeInstance.elements({
      fonts: [{ cssSrc: 'https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap' }]
    });
    cardElement = elements.create('card', {
      style: {
        base: {
          fontFamily: "'DM Sans', sans-serif",
          fontSize: '14px',
          color: '#1c3828',
          '::placeholder': { color: '#a8c8b4' }
        },
        invalid: { color: '#b94040' }
      }
    });
    cardElement.mount('#stripe-card-element');
    cardElement.on('focus', () => document.getElementById('stripe-card-element')?.classList.add('focused'));
    cardElement.on('blur',  () => document.getElementById('stripe-card-element')?.classList.remove('focused'));
    cardElement.on('change', (e) => {
      document.getElementById('ck-error').textContent = e.error ? e.error.message : '';
    });
  }

  /* ══════════════════════════════════════════
     PLAN SELECTION
  ══════════════════════════════════════════ */
  function selectPlan(plan) {
    document.querySelectorAll('.ck-plan').forEach(p => p.classList.remove('selected'));
    if (plan === 'full') {
      selectedAmount = 497; selectedPlan = 'Full Payment';
      document.getElementById('plan-full').classList.add('selected');
    } else {
      selectedAmount = 100; selectedPlan = 'Deposit';
      document.getElementById('plan-deposit').classList.add('selected');
    }
    const btn = document.getElementById('ck-pay-btn');
    if (btn) btn.querySelector('.btn-label').textContent = `Pay £${selectedAmount} Securely 🔒`;
  }

  /* ══════════════════════════════════════════
     PAYMENT HANDLER
  ══════════════════════════════════════════ */
  async function handlePayment() {
    const name  = document.getElementById('ck-name')?.value.trim();
    const email = document.getElementById('ck-email')?.value.trim();
    const errEl = document.getElementById('ck-error');

    if (!name)  { errEl.textContent = 'Please enter your full name.'; return; }
    if (!email || !email.includes('@')) { errEl.textContent = 'Please enter a valid email address.'; return; }
    errEl.textContent = '';

    const btn = document.getElementById('ck-pay-btn');
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const intentRes = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action:    'create_payment_intent',
          amount:    selectedAmount,
          plan:      selectedPlan,
          name,
          email,
          sessionId: SESSION_ID
        })
      });

      if (!intentRes.ok) throw new Error('Could not initiate payment. Please try again.');
      const intentData = await intentRes.json();
      if (!intentData.clientSecret) throw new Error('Payment setup failed. Please try again.');

      const result = await stripeInstance.confirmCardPayment(intentData.clientSecret, {
        payment_method: {
          card: cardElement,
          billing_details: { name, email }
        }
      });

      if (result.error) {
        errEl.textContent = result.error.message;
        btn.disabled = false;
        btn.classList.remove('loading');
        return;
      }

      const paymentId = result.paymentIntent.id;
      document.getElementById('checkout-card')?.remove();
      appendSuccess(name, email, selectedAmount, selectedPlan, paymentId);

    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong. Please try again.';
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  /* ══════════════════════════════════════════
     SUCCESS MESSAGE
  ══════════════════════════════════════════ */
  function appendSuccess(name, email, amount, plan, paymentId) {
    const m = document.getElementById('msgs');
    const d = document.createElement('div');
    d.className = 'msg';
    const firstName = name.split(' ')[0];
    const refShort  = paymentId ? paymentId.slice(-8).toUpperCase() : '--------';
    d.innerHTML = `
      <div class="mav b">H</div>
      <div class="success-bub">
        <span class="success-icon">🎉</span>
        <div class="success-title">JazakAllah Khair, ${escapeHtml(firstName)}!</div>
        <div class="success-msg">
          Your ${escapeHtml(plan)} of <strong>£${amount}</strong> was successful.
          A confirmation has been sent to <strong>${escapeHtml(email)}</strong> with your login details and next steps.<br><br>
          Welcome to Hijama Nation! Your journey starts now. 🌿
        </div>
        <div class="success-ref">Ref: #${refShort}</div>
      </div>
    `;
    m.appendChild(d);
    scrollB();
  }

  /* ══════════════════════════════════════════
     MAIN SEND LOGIC
  ══════════════════════════════════════════ */
  function onKey(e)  { if (e.key === 'Enter' && !isBusy) send(); }

  function send() {
    const inp = document.getElementById('inp');
    const txt = inp.value.trim();
    if (!txt || isBusy) return;
    inp.value = ''; inp.focus();
    sendMessage(txt);
  }

  async function sendMessage(txt) {
    if (isBusy) return;
    lastUserMessage = txt;
    setBusy(true);
    appendUser(txt);
    const tid = appendTyping();
    scrollB();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message:   txt,
          source:    'hijama_chatbot',
          sessionId: SESSION_ID
        })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      document.getElementById(tid)?.remove();

      const reply =
        data.message || data.reply || data.output || data.text ||
        'JazakAllah Khair! I received your message.';

      const cleanReply = reply.replace(/\[show_checkout\]/gi, '').trim();
      appendBot(cleanReply);

      if (data.action === 'show_checkout' || /\[show_checkout\]/i.test(reply)) {
        setTimeout(() => appendCheckout(), 700);
      }

    } catch (err) {
      document.getElementById(tid)?.remove();
      appendError();
    } finally {
      setBusy(false);
      document.getElementById('inp').focus();
    }
  }

  /* ══════════════════════════════════════════
     INIT — render opening on page load
  ══════════════════════════════════════════ */
  window.addEventListener('DOMContentLoaded', () => {
    renderOpening();
    if (window.innerWidth >= 600) document.getElementById('inp').focus();
  });

  window.addEventListener('resize', scrollB);
  document.body.addEventListener('touchmove',(e)=>{
    if (!e.target.closest('.msgs')) e.preventDefault();
  },{ passive: false });
</script>
</body>
